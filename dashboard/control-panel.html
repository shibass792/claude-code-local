<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code Local — לוח בקרה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --ink: #e8eef7;
      --muted: #93a4bb;
      --ok: #3dbe7a;
      --warn: #e0a43a;
      --bad: #e85d5d;
      --accent: #4aa3ff;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rubik", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(74,163,255,0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(61,190,122,0.12), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #121820);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.2rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 1.6rem;
      max-width: 40rem;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.4rem;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    button:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); }
    button:active { transform: translateY(1px); }
    button.primary { background: rgba(74,163,255,0.18); border-color: rgba(74,163,255,0.45); }
    button.ok { background: rgba(61,190,122,0.16); border-color: rgba(61,190,122,0.4); }
    .grid {
      display: grid;
      gap: 0.9rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 1.2rem;
    }
    .tile {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.05rem;
      background: rgba(0,0,0,0.22);
      min-height: 110px;
    }
    .tile h2 {
      margin: 0 0 0.45rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
    }
    .tile .val {
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.05rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .dot {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-inline-start: 0.35rem;
      vertical-align: middle;
      background: var(--muted);
    }
    .dot.up { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,190,122,0.2); }
    .dot.down { background: var(--bad); box-shadow: 0 0 0 3px rgba(232,93,93,0.18); }
    pre {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      background: rgba(0,0,0,0.35);
      overflow: auto;
      max-height: 420px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .note {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>לוח בקרה — מוכן לעבודה</h1>
    <p class="sub">סריקת קוד (HTML / PS1 / PY), זיכרון, דיסק, והפעלת מערכות מקומיות. כפתורים בודקים ומפעילים שירותים.</p>

    <div class="actions">
      <button class="primary" id="btnStatus" type="button">בדיקת סטטוס מלאה</button>
      <button id="btnScan" type="button">סרוק קבצי קוד</button>
      <button id="btnMem" type="button">בדוק זיכרון</button>
      <button id="btnSvc" type="button">בדוק שירותים</button>
      <button class="ok" id="btnStartH" type="button">הפעל H-Drive</button>
      <button class="ok" id="btnStartAll" type="button">הפעל הכל</button>
    </div>

    <div class="grid">
      <div class="tile"><h2>זיכרון פנוי</h2><div class="val" id="memVal">—</div></div>
      <div class="tile"><h2>דיסק פנוי</h2><div class="val" id="diskVal">—</div></div>
      <div class="tile"><h2>H-Drive API</h2><div class="val">פורט 18765 <span class="dot" id="dotH"></span></div></div>
      <div class="tile"><h2>MLX Server</h2><div class="val">פורט 4000 <span class="dot" id="dotMlx"></span></div></div>
      <div class="tile"><h2>קבצי PY</h2><div class="val" id="pyCount">—</div></div>
      <div class="tile"><h2>HTML / PS1</h2><div class="val" id="htmlPs1">—</div></div>
    </div>

    <pre id="out">לוחץ על כפתור כדי להתחיל…</pre>
    <p class="note" id="note"></p>
  </main>
  <script>
    const out = document.getElementById("out");
    const note = document.getElementById("note");

    function setDot(id, up) {
      const el = document.getElementById(id);
      el.classList.toggle("up", !!up);
      el.classList.toggle("down", !up);
    }

    async function getJSON(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json();
      return { res, data };
    }

    function show(data) {
      out.textContent = JSON.stringify(data, null, 2);
    }

    function paintStatus(data) {
      if (data.memory) {
        document.getElementById("memVal").textContent =
          `${data.memory.available_mb ?? "?"} MB / ${data.memory.total_mb ?? "?"} MB`;
      }
      if (data.disk) {
        document.getElementById("diskVal").textContent =
          `${data.disk.free_gb ?? "?"} GB פנוי`;
      }
      if (data.scan) {
        document.getElementById("pyCount").textContent =
          `${data.scan.counts.py} קבצים` +
          (data.scan.py_syntax_errors?.length ? ` · ${data.scan.py_syntax_errors.length} שגיאות` : " · תקינים");
        document.getElementById("htmlPs1").textContent =
          `HTML ${data.scan.counts.html} · PS1 ${data.scan.counts.ps1}`;
      }
      if (data.services) {
        setDot("dotH", data.services.h_drive?.up);
        setDot("dotMlx", data.services.mlx?.up);
      }
      if (data.note) note.textContent = data.note;
    }

    async function refreshStatus() {
      const { data } = await getJSON("/api/status");
      paintStatus(data);
      show(data);
      return data;
    }

    document.getElementById("btnStatus").onclick = () => refreshStatus().catch(e => show({ error: String(e) }));
    document.getElementById("btnScan").onclick = async () => {
      try {
        const { data } = await getJSON("/api/scan");
        document.getElementById("pyCount").textContent = `${data.counts.py} קבצים`;
        document.getElementById("htmlPs1").textContent = `HTML ${data.counts.html} · PS1 ${data.counts.ps1}`;
        show(data);
      } catch (e) { show({ error: String(e) }); }
    };
    document.getElementById("btnMem").onclick = async () => {
      try {
        const { data } = await getJSON("/api/memory");
        document.getElementById("memVal").textContent =
          `${data.memory.available_mb} MB / ${data.memory.total_mb} MB`;
        document.getElementById("diskVal").textContent = `${data.disk.free_gb} GB פנוי`;
        show(data);
      } catch (e) { show({ error: String(e) }); }
    };
    document.getElementById("btnSvc").onclick = async () => {
      try {
        const { data } = await getJSON("/api/services");
        setDot("dotH", data.h_drive?.up);
        setDot("dotMlx", data.mlx?.up);
        show(data);
      } catch (e) { show({ error: String(e) }); }
    };
    document.getElementById("btnStartH").onclick = async () => {
      try {
        const { data } = await getJSON("/api/start/h-drive", { method: "POST" });
        show(data);
        await refreshStatus();
      } catch (e) { show({ error: String(e) }); }
    };
    document.getElementById("btnStartAll").onclick = async () => {
      try {
        const { data } = await getJSON("/api/start/all", { method: "POST" });
        show(data);
        setTimeout(() => refreshStatus(), 1500);
      } catch (e) { show({ error: String(e) }); }
    };

    refreshStatus().catch(() => {
      out.textContent = "השרת לא רץ. הפעל: python3 scripts/system_ready.py all";
    });
  </script>
</body>
</html>
