[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbrain"
version = "0.1.0"
description = "Local studio knowledge engine — Match Panel for ARP/Cubase/Ableton"
readme = "docs/SOUNDBRAIN.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SHIBASS" }]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
dev = ["pytest>=8.0"]

[project.scripts]
soundbrain = "soundbrain.cli:main"

[tool.setuptools.packages.find]
include = ["soundbrain*"]

[tool.setuptools.package-data]
soundbrain = [
  "data/*.json",
  "web/static/css/*",
  "web/static/js/*",
  "web/static/panel/*",
]
